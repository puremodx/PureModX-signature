name: Build PureKiller DEX

on:
  workflow_dispatch:
  push:
    paths:
      - 'smali/**'
      - '.github/workflows/build-dex.yml'

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Smali assembler
        run: |
          curl -fL --retry 3             https://repo1.maven.org/maven2/com/android/tools/smali/smali/2.5.2/smali-2.5.2.jar             -o smali.jar
      - name: Assemble DEX
        run: |
          java -jar smali.jar assemble smali -o PureKiller.dex
          test -s PureKiller.dex
          file PureKiller.dex
      - name: Upload DEX artifact
        uses: actions/upload-artifact@v4
        with:
          name: PureKiller-dex
          path: PureKiller.dex
          if-no-files-found: error
